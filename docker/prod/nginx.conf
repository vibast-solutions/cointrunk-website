server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;
    gzip_min_length 1024;

    # hashed build assets are immutable
    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location ~* \.(ico|png|jpg|jpeg|svg|webp|gif|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public";
    }

    # everything else is HTML entry points and small text files — always
    # revalidate so releases show up immediately (static export writes one
    # <route>.html per page, requested extensionless)
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri.html $uri/ =404;
    }

    error_page 404 /404.html;
}
