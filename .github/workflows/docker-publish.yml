name: docker-publish

# Builds the static nginx image of this site and pushes it to GHCR as
# ghcr.io/vibast-solutions/cointrunk-website:<sha8> — on manual runs only.
#
# This repo no longer deploys: cointrunk.io is now served by a new website
# built and released from another repository. The push trigger and the
# deploy dispatch were removed so that a merge here can never overwrite the
# live site. Images built by hand from here are not deployable under the
# current production setup.
on:
  workflow_dispatch:   # build + push only, never deploys

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-publish
  cancel-in-progress: false

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compute image tag
        id: vars
        # --short=8 pinned: the tag is always the first 8 chars of the sha, so
        # it can be derived from any commit listing without asking git.
        run: echo "sha=$(git rev-parse --short=8 HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/prod/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ steps.vars.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha

      - name: Summary
        run: echo "Pushed ghcr.io/${{ github.repository }}:${{ steps.vars.outputs.sha }}" >> "$GITHUB_STEP_SUMMARY"
